<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>CHICHA&rsquo;S | Indian Street Food &amp; Boba in St. Augustine</title>
    <meta
      name="description"
      content="Indian street food and boba in St. Augustine, Florida. Explore the CHICHA'S menu, follow us on Instagram, join our WhatsApp community and get directions."
    />
    <!-- Matches the default (dark) theme; useTheme keeps it in sync on toggle. -->
    <meta name="theme-color" content="#16100C" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social preview. After deploying, swap the two URLs below for absolute
         ones (e.g. https://your-domain.com/images/og-image.jpg) so that
         Instagram, WhatsApp and iMessage can fetch the card image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CHICHA'S" />
    <meta property="og:title" content="CHICHA'S | Indian Street Food &amp; Boba" />
    <meta
      property="og:description"
      content="Big flavours, good vibes. Indian street food and boba in St. Augustine, Florida."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The CHICHA'S logo: Indian Street Food and Boba." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/chichas-logo-480.webp" fetchpriority="high" />

    <script>
      // The site opens in dark by default; a visitor's saved choice wins.
      // Resolved before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('chichas-theme');
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
